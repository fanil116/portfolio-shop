x-backend_environment: &backend_environment
  environment:
    - DEBUG
    - API_DOCS_ENABLE
    - SECRET_KEY
    - SITE_HOST
    - ALLOWED_HOSTS
    - CSRF_TRUSTED_ORIGINS
    - COOKIE_SECURE
    - POSTGRES_HOST=${POSTGRES_HOST:-db}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - POSTGRES_NAME=${POSTGRES_NAME:-postgres}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD
    - REDIS_HOST=${REDIS_HOST:-redis}
    - REDIS_PORT=${REDIS_PORT:-6379}
    - EMAIL_HOST
    - EMAIL_PORT
    - EMAIL_HOST_USER
    - EMAIL_HOST_PASSWORD
    - EMAIL_USE_TLS
    - SENTRY_DSN
    - SENTRY_ENVIRONMENT

services:
  backend:
    container_name: backend
    image: portfolio-shop/backend:${TAG:-latest}
    build:
      context: ./backend
    depends_on:
      - db
      - redis
    <<: *backend_environment

  db:
    container_name: db
    image: portfolio-shop/db:${TAG:-latest}
    build:
      context: ./db
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_NAME:-postgres}

  redis:
    container_name: redis
    image: redis:7.4-alpine

  celery:
    container_name: celery
    image: portfolio-shop/backend:${TAG:-latest}
    command: uv run celery -A config worker -l info -c 1 -Q celery
    depends_on:
      - db
      - redis
    <<: *backend_environment

  celery-beat:
    container_name: celery-beat
    image: portfolio-shop/backend:${TAG:-latest}
    command: uv run celery -A config beat -l info
    depends_on:
      - db
      - redis
    <<: *backend_environment
